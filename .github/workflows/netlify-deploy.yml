name: Netlify Deploy

# 部署展示站到 Netlify（CLI 方式，不用 Netlify 自己构建）。
# 采集仍由 NAS Docker 负责（每 5 分钟一次 push 数据），本 Actions 只做：
#   1. checkout 最新代码（含 NAS push 的数据文件）
#   2. netlify deploy --prod 直接把根目录推上去
# Netlify 那边 0 构建消耗，完全绕开构建额度问题。
# 前置：仓库 Secrets 配好 NETLIFY_AUTH_TOKEN 和 NETLIFY_SITE_ID。

on:
  schedule:
    # UTC 时间；北京时间 = UTC+8
    # 0,4,8,12,16 UTC → 北京 8/12/16/20/24 点，一天 5 次，数据最多滞后 4 小时
    - cron: '0 0,4,8,12,16 * * *'
  # 手动触发：Actions 页面 → Run workflow
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 安装 Netlify CLI
        run: npm install -g netlify-cli

      - name: 部署到 Netlify（生产）
        env:
          NETLIFY_AUTH_TOKEN: ${{ secrets.NETLIFY_AUTH_TOKEN }}
          NETLIFY_SITE_ID: ${{ secrets.NETLIFY_SITE_ID }}
        # --dir=. 根目录即站点；--prod 直接发到生产；--message 标记本次部署
        run: |
          netlify deploy \
            --dir=. \
            --prod \
            --message "deploy from GitHub Actions: $(date -u '+%Y-%m-%d %H:%M') UTC"
